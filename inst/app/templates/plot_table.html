<div style="font-family:Poppins, Arial, sans-serif; margin:21px auto; max-width:760px;">
  <div style="
    background:#ffffff;
    border:1px solid #e4eaf3;
    border-radius:16px;
    box-shadow:0 12px 28px rgba(0,0,0,0.06);
    padding:18px 20px 20px 20px;
    overflow:visible;
  ">
<!-- Table title -->
<div style="
  margin:-6px -2px 10px -2px;
  padding:10px 14px;
  background:#f5f9ff;
  border:1px solid #dee6f2;
  border-radius:10px;
  text-align:center;
  font-size:0.95rem;
  font-weight:600;
  color:#16324a;
">
  <span style="color:#16324a;">{param}</span>
  <span style="color:#6b7c8f; font-weight:500;">&nbsp;•&nbsp;{units}</span>
</div>

    <table style="
      width:100%;
      border-collapse:collapse;
      font-size:0.9rem;
      overflow:visible;
    ">
      <thead>
        <tr style="background:#f5f9ff;">

          <!-- Metric -->
          <th style="
            text-align:left;
            padding:12px 14px;
            font-size:1rem;
            border-bottom:2px solid #dee6f2;
          ">
            Metric
          </th>

          <!-- Current year -->
          <th style="
            text-align:right;
            padding:12px 14px;
            font-size:1rem;
            border-bottom:2px solid #dee6f2;
            color:{current_color};
          ">
            {current_year}
          </th>

          <!-- All + tooltip -->
          <th style="
            text-align:right;
            padding:12px 14px;
            font-size:1rem;
            border-bottom:2px solid #dee6f2;
            color:{other_color};
            position:relative;
          ">
            All Years
          </th>
        </tr>
      </thead>

      <tbody>
        {rows_html}
      </tbody>
    </table>
  </div>
</div>
